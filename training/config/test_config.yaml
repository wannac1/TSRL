mode: test
data_manner: lmdb
test_aug:
  log_dir: 'eval/batch_results'
  use_aug: false
  option: ["crop","pad","shift","blur","brightness","quality","GridShuffle","GridDropout","GaussNoise"]
  crop:
    crop_px: -50
    p: 0
  pad:
    pad_px: 50
    p: 0
  shift:
    shift_dx: 0
    shift_dy: 0
    p: 0
  blur:
    p: 0
    blur_limit: [5,5]
  brightness:
    p: 0
    brightness_limit: [ 0.1, 0.1 ]
  quality:
    p: 0
    quality_lower: 70
    quality_upper: 70
  use_train_aug: false

  GridDropout:
    p: 0
    ratio: 0.2

  GridShuffle: # RdS
    p: 0
    grid_g: 2

  GaussNoise:
    p: 0


save_txt: true

save_pickle: true

save_feature: true

sample_size: 256

GridShuffle:
  p: 0
  grid_g: 2

Gating: 'None' # CG, SG


two_trans: false # tt
Con_GridShuffle: # RdS
  p: 1
  grid_g: 3

Bimix_Shuffle:
  apply_real: true # F if false, else refer cut.
  apply_fake: true
  apply_mix: true
  mix_default: 'origin'

  mix_real_label: 0 # Mrl, default is 0
  real_fix_label: True
  mix_label: 1 # Ml
  mix_fix_label: True
  #cutRRRm  cutAbsRRRm: the neg/pos problem of r
  real_cut: 'half' # random random_mg half
  fake_cut: 'random_mg'
  mix_cut: 'random_mg'

  real_num: 2 # N=2 is default
  fake_num: 2
  mix_num: 2

  mix_type: 'ClockMix'

  p: 1 # data mix prob
  loc: 'angleR' # right, top, random (RdL), angle, angelR
mode: test
lmdb: True
use_combined_lmdb: True
dataset_root_rgb: './datasets/rgb'
lmdb_dir:  './datasets/lmdb'
dataset_json_folder: './preprocessing/dataset_json'

